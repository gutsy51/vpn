[project]
name = "personal-vpn-manager"
version = "0.2.0"
description = "Управление личной VPN-инфраструктурой"
requires-python = ">=3.11"
dependencies = [
    "textual>=1",
    "asyncssh>=2",
    "python-dotenv>=1",
    "aiogram[proxy]>=3,<4",
    "filelock>=4.3.1",
]

[project.scripts]
vpn-manager = "src.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

