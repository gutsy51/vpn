[project]
name = "personal-vpn-manager"
version = "0.2.0"
description = "Управление личной VPN-инфраструктурой"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3,<4",
    "aiohttp>=3.14.5",
    "maxapi>=1.2.4",
    "portalocker>=4.4.2",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
]

[project.scripts]
vpn-manager = "vpn_manager.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src/vpn_manager"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["vpn_manager"]
